name: RetroAmp Signed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - retroamp-neon-redesign
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.RETROAMP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Configure RETROAMP_KEYSTORE_BASE64 in GitHub Actions secrets before building."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/retroamp-release.jks"

      - name: Build signed release
        env:
          RETROAMP_KEYSTORE_PATH: ${{ runner.temp }}/retroamp-release.jks
          RETROAMP_STORE_PASSWORD: ${{ secrets.RETROAMP_STORE_PASSWORD }}
          RETROAMP_KEY_ALIAS: ${{ secrets.RETROAMP_KEY_ALIAS }}
          RETROAMP_KEY_PASSWORD: ${{ secrets.RETROAMP_KEY_PASSWORD }}
        run: |
          for name in RETROAMP_STORE_PASSWORD RETROAMP_KEY_ALIAS RETROAMP_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name"
              exit 1
            fi
          done
          gradle assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroAmp-Neon-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
